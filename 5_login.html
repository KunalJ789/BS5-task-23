<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5. Login Page
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">
<div class="container h-auto d-flex align-items-center justify-content-center py-5">
 <div class="row w-100 justify-content-center">
   <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
    <div class="card shadow-sm border-0 rounded-3 p-3 p-md-4">
      <div class="card-body">
       <h3 class="card-title text-center fw-bold mb-2">Welcome Back</h3> 
       <p class="text-center mb-4">Please enter your details to sign in</p>
 <form>
    <div class="mb-3">
     <label class="form-label">Email address</label>   
     <input type="email" class="form-control" placeholder="name@example.com" name="email" id="email">     
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>  
      <input type="password" class="form-control" placeholder="••••••••." name="pwd" id="pwd" required>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div class="form-check">
       <input type="checkbox" class="form-check-input" id="check"> 
       <label class="form-check-label small">Remember Me</label>
      </div>  
     <a href="" class="small text-decoration-none">Forgot Password?</a> 
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>

    <div class="text-center mt-4">
      <span class="small">Don't have an account?</span> 
      <a href="" class="small text-decoration-none fw-semibold">Sign Up</a> 
    </div>
 </form>      
      </div>  
    </div>
   </div> 
 </div>
</div>
</body>

</html>
